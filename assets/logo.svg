<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="35%" stop-color="#C084FC" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="darkPurpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e2b" />
      <stop offset="100%" stop-color="#090510" />
    </linearGradient>
    <filter id="neonGlowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="superGlowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Purple Glow -->
  <circle cx="250" cy="250" r="185" fill="url(#cyberPurple)" opacity="0.22" filter="url(#superGlowPurple)" />

  <!-- Outer Hexagon Frame -->
  <polygon points="250,35 435,142 435,358 250,465 65,358 65,142" 
           fill="url(#darkPurpleBg)" 
           stroke="url(#cyberPurple)" 
           stroke-width="10" 
           stroke-linejoin="round"
           filter="url(#neonGlowPurple)"/>

  <!-- Inner Hexagon Detail -->
  <polygon points="250,65 405,155 405,345 250,435 95,345 95,155" 
           fill="none" 
           stroke="#C084FC" 
           stroke-width="3" 
           stroke-dasharray="14 8"
           opacity="0.45" />

  <!-- Power 'X' Monogram / Cyber Bolt Emblem -->
  <g filter="url(#neonGlowPurple)">
    <!-- Diagonal 1 -->
    <path d="M 160 150 L 220 150 L 340 350 L 280 350 Z" fill="url(#cyberPurple)" />
    <!-- Diagonal 2 -->
    <path d="M 340 150 L 280 150 L 160 350 L 220 350 Z" fill="url(#cyberPurple)" opacity="0.9" />
    <!-- Power Lightning Center Bolt in Crisp White -->
    <polygon points="250,130 268,220 236,220 258,280 232,280 250,370 235,270 262,270 242,210 266,210" 
             fill="#ffffff" 
             filter="url(#neonGlowPurple)"/>
  </g>

  <!-- Cyber Node Accents -->
  <circle cx="250" cy="35" r="7" fill="#E9D5FF" filter="url(#neonGlowPurple)"/>
  <circle cx="435" cy="142" r="7" fill="#A855F7" filter="url(#neonGlowPurple)"/>
  <circle cx="435" cy="358" r="7" fill="#A855F7" filter="url(#neonGlowPurple)"/>
  <circle cx="250" cy="465" r="7" fill="#7E22CE" filter="url(#neonGlowPurple)"/>
  <circle cx="65" cy="358" r="7" fill="#A855F7" filter="url(#neonGlowPurple)"/>
  <circle cx="65" cy="142" r="7" fill="#A855F7" filter="url(#neonGlowPurple)"/>
</svg>
