<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1545"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </radialGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Crosshair Reticle & ESP Lines -->
  <circle cx="300" cy="270" r="130" fill="none" stroke="#A855F7" stroke-width="2" stroke-opacity="0.25"/>
  <circle cx="300" cy="270" r="90" fill="none" stroke="url(#neonPurple)" stroke-width="3" stroke-dasharray="16 12" filter="url(#glow)"/>
  <circle cx="300" cy="270" r="45" fill="none" stroke="#C084FC" stroke-width="2"/>
  <circle cx="300" cy="270" r="5" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Reticle lines -->
  <line x1="120" y1="270" x2="230" y2="270" stroke="url(#neonPurple)" stroke-width="3" filter="url(#glow)"/>
  <line x1="370" y1="270" x2="480" y2="270" stroke="url(#neonPurple)" stroke-width="3" filter="url(#glow)"/>
  <line x1="300" y1="90" x2="300" y2="200" stroke="url(#neonPurple)" stroke-width="3" filter="url(#glow)"/>
  <line x1="300" y1="340" x2="300" y2="450" stroke="url(#neonPurple)" stroke-width="3" filter="url(#glow)"/>

  <!-- ESP Bounding Box -->
  <rect x="210" y="170" width="180" height="200" rx="6" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.6"/>
  <!-- Corner highlights -->
  <path d="M 210 190 L 210 170 L 230 170" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M 390 190 L 390 170 L 370 170" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M 210 350 L 210 370 L 230 370" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M 390 350 L 390 370 L 370 370" fill="none" stroke="#ffffff" stroke-width="4"/>

  <!-- Text info in ESP box -->
  <text x="215" y="160" font-family="'Prompt', sans-serif" font-weight="700" font-size="14" fill="#C084FC">AIMBOT: ACTIVE [100%]</text>

  <!-- Title Badge -->
  <text x="300" y="490" text-anchor="middle" font-family="'Prompt', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="3" filter="url(#glow)">VALOR EXTERNAL VIP</text>
  <text x="300" y="530" text-anchor="middle" font-family="'Prompt', sans-serif" font-weight="600" font-size="18" fill="#A855F7" letter-spacing="2">ESP • SILENT AIM • STREAMPROOF • UNDETECTED</text>
</svg>
