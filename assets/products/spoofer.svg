<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24143a"/>
      <stop offset="100%" stop-color="#090510"/>
    </radialGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Cyber grid -->
  <g stroke="#A855F7" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
  </g>

  <!-- Glowing Shield & CPU -->
  <circle cx="300" cy="270" r="140" fill="#A855F7" fill-opacity="0.1" filter="url(#glow)"/>
  <polygon points="300,140 420,200 420,340 300,430 180,340 180,200" fill="#130b20" stroke="url(#neonPurple)" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Hardware Chip icon -->
  <rect x="240" y="220" width="120" height="120" rx="16" fill="#1f1134" stroke="#A855F7" stroke-width="4"/>
  <rect x="265" y="245" width="70" height="70" rx="8" fill="#A855F7" fill-opacity="0.25"/>
  
  <!-- Circuit pins -->
  <line x1="260" y1="200" x2="260" y2="220" stroke="#C084FC" stroke-width="4"/>
  <line x1="300" y1="200" x2="300" y2="220" stroke="#C084FC" stroke-width="4"/>
  <line x1="340" y1="200" x2="340" y2="220" stroke="#C084FC" stroke-width="4"/>
  <line x1="260" y1="340" x2="260" y2="360" stroke="#C084FC" stroke-width="4"/>
  <line x1="300" y1="340" x2="300" y2="360" stroke="#C084FC" stroke-width="4"/>
  <line x1="340" y1="340" x2="340" y2="360" stroke="#C084FC" stroke-width="4"/>
  
  <!-- Text Badges -->
  <text x="300" y="490" text-anchor="middle" font-family="'Prompt', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="3" filter="url(#glow)">TITAN SPOOFER V3</text>
  <text x="300" y="530" text-anchor="middle" font-family="'Prompt', sans-serif" font-weight="600" font-size="18" fill="#C084FC" letter-spacing="2">BYPASS EAC • BE • FIVEM (PERMANENT)</text>
</svg>
